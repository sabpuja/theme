name: Complete Shopify staging asset snapshot
on:
  push:
    branches: [staging-2026]
    paths:
      - .github/workflows/sync-shopify-large-assets.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026
      - name: Download and verify Shopify assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/3e7e/0923/1381/3308/t/5/assets/bundle-vendors.js?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/bundle-vendors.js'
          test "$(md5sum 'assets/bundle-vendors.js' | awk '{print $1}')" = '18f5bbbe93dc8bdb800cc78ac2093677'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/be57/0923/1381/3308/t/5/assets/bundle.js?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/bundle.js'
          test "$(md5sum 'assets/bundle.js' | awk '{print $1}')" = '24441b3169ba0bc7e8e43156ff8d4dcb'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/deed/0923/1381/3308/t/5/assets/page-build-rtl.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/page-build-rtl.css'
          test "$(md5sum 'assets/page-build-rtl.css' | awk '{print $1}')" = 'f43f2dc18e9e5363906dd87ead775531'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/136e/0923/1381/3308/t/5/assets/page-build.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/page-build.css'
          test "$(md5sum 'assets/page-build.css' | awk '{print $1}')" = 'f69da24fd25c9afc1298d9c948b07221'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/6992/0923/1381/3308/t/5/assets/section-build-rtl.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/section-build-rtl.css'
          test "$(md5sum 'assets/section-build-rtl.css' | awk '{print $1}')" = 'da370ef3373a452f18757f3dea819230'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/73e3/0923/1381/3308/t/5/assets/section-build.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/section-build.css'
          test "$(md5sum 'assets/section-build.css' | awk '{print $1}')" = '97acb0dc062d6ea8a988db2680d493fa'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/b907/0923/1381/3308/t/5/assets/section.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/section.css'
          test "$(md5sum 'assets/section.css' | awk '{print $1}')" = '4b0ce960c986d75b2aad631168d144b9'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/290a/0923/1381/3308/t/5/assets/section.css.liquid?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/section.css.liquid'
          test "$(md5sum 'assets/section.css.liquid' | awk '{print $1}')" = '4b0ce960c986d75b2aad631168d144b9'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/202a/0923/1381/3308/t/5/assets/style-rtl.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/style-rtl.css'
          test "$(md5sum 'assets/style-rtl.css' | awk '{print $1}')" = '85727cff80687b6aaa9806a2d110b3b9'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/90c6/0923/1381/3308/t/5/assets/style.css?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180714Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/style.css'
          test "$(md5sum 'assets/style.css' | awk '{print $1}')" = '25ea5971ea7b688a57b1659e3ef95499'
      - name: Commit exact asset snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Verify exact Shopify staging large text assets"
          git push origin HEAD:staging-2026
