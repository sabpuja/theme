name: Complete Shopify staging asset snapshot
on:
  push:
    branches: [staging-2026]
    paths:
      - .github/workflows/sync-shopify-large-assets.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026
      - name: Download and verify Shopify assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/0f0f/0923/1381/3308/t/5/assets/password-bg.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/password-bg.jpg'
          test "$(md5sum 'assets/password-bg.jpg' | awk '{print $1}')" = 'e79f9c686f307e19a2410979a9d1f784'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/1ffb/0923/1381/3308/t/5/assets/sabpuja-festival-gifting-family-01.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-festival-gifting-family-01.webp'
          test "$(md5sum 'assets/sabpuja-festival-gifting-family-01.webp' | awk '{print $1}')" = 'e0eb03a95ace032e745864fee2f474f2'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/e080/0923/1381/3308/t/5/assets/sabpuja-how-it-works-step-01-browse-on-store.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-how-it-works-step-01-browse-on-store.webp'
          test "$(md5sum 'assets/sabpuja-how-it-works-step-01-browse-on-store.webp' | awk '{print $1}')" = '558f0ab6b0ff92a54b879af305575e4f'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/0d04/0923/1381/3308/t/5/assets/sabpuja-how-it-works-step-02-kit-arrives.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-how-it-works-step-02-kit-arrives.webp'
          test "$(md5sum 'assets/sabpuja-how-it-works-step-02-kit-arrives.webp' | awk '{print $1}')" = '8ceda46c7c7ad25b25f6dac338f3f9c0'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/ffb8/0923/1381/3308/t/5/assets/sabpuja-how-it-works-step-03-guide-and-qr.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-how-it-works-step-03-guide-and-qr.webp'
          test "$(md5sum 'assets/sabpuja-how-it-works-step-03-guide-and-qr.webp' | awk '{print $1}')" = 'f150da5628cad195566fc9d96eeadc82'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/fff1/0923/1381/3308/t/5/assets/sabpuja-upcoming-festivals-diwali-01.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-upcoming-festivals-diwali-01.webp'
          test "$(md5sum 'assets/sabpuja-upcoming-festivals-diwali-01.webp' | awk '{print $1}')" = 'cfe2c96422f10e3ce0104d6ec96879bc'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/7a92/0923/1381/3308/t/5/assets/sabpuja-upcoming-festivals-dussehra-01.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-upcoming-festivals-dussehra-01.webp'
          test "$(md5sum 'assets/sabpuja-upcoming-festivals-dussehra-01.webp' | awk '{print $1}')" = '257edff0ec98b77fbabf62419d413772'
          curl -fL --retry 3 --retry-delay 1 'https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/c827/0923/1381/3308/t/5/assets/sabpuja-upcoming-festivals-navratri-01.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20260918%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260918T180608Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-' -o 'assets/sabpuja-upcoming-festivals-navratri-01.webp'
          test "$(md5sum 'assets/sabpuja-upcoming-festivals-navratri-01.webp' | awk '{print $1}')" = 'c9f68c029ea5abcaed723dad0e5da647'
      - name: Commit exact asset snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Complete Shopify staging large asset snapshot"
          git push origin HEAD:staging-2026
