name: Import Zodiac Batch 02 WebP assets

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/import-zodiac-batch-02.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026

      - name: Download approved Zodiac Batch 02 assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-leo-hero.webp?v=1790090253' -o assets/sabpuja-zodiac-leo-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-leo-contents.webp?v=1790090260' -o assets/sabpuja-zodiac-leo-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-virgo-hero.webp?v=1790090270' -o assets/sabpuja-zodiac-virgo-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-virgo-contents.webp?v=1790090277' -o assets/sabpuja-zodiac-virgo-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-libra-hero.webp?v=1790090283' -o assets/sabpuja-zodiac-libra-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-libra-contents.webp?v=1790090304' -o assets/sabpuja-zodiac-libra-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-scorpio-hero.webp?v=1790090310' -o assets/sabpuja-zodiac-scorpio-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-scorpio-contents.webp?v=1790090316' -o assets/sabpuja-zodiac-scorpio-contents.webp

          file assets/sabpuja-zodiac-{leo,virgo,libra,scorpio}-{hero,contents}.webp
          sha256sum assets/sabpuja-zodiac-{leo,virgo,libra,scorpio}-{hero,contents}.webp

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add assets/sabpuja-zodiac-{leo,virgo,libra,scorpio}-{hero,contents}.webp
          if git diff --cached --quiet; then
            echo 'Assets already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add Zodiac Batch 02 WebPs'
          git push origin HEAD:staging-2026
