name: Import Zodiac Batch 03 WebP assets

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/import-zodiac-batch-03.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download approved-logo corrected PNG masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zodiac-batch-03

          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-sagittarius-hero-source.png?v=1790095517' -o /tmp/zodiac-batch-03/sagittarius-hero.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-sagittarius-contents-source.png?v=1790095542' -o /tmp/zodiac-batch-03/sagittarius-contents.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-capricorn-hero-source.png?v=1790095550' -o /tmp/zodiac-batch-03/capricorn-hero.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-capricorn-contents-source.png?v=1790095558' -o /tmp/zodiac-batch-03/capricorn-contents.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-aquarius-hero-source.png?v=1790095565' -o /tmp/zodiac-batch-03/aquarius-hero.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-aquarius-contents-source.png?v=1790095572' -o /tmp/zodiac-batch-03/aquarius-contents.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-pisces-hero-source.png?v=1790095579' -o /tmp/zodiac-batch-03/pisces-hero.png
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-pisces-contents-source.png?v=1790095608' -o /tmp/zodiac-batch-03/pisces-contents.png

      - name: Convert to canonical WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/sagittarius-hero.png -o assets/sabpuja-zodiac-sagittarius-hero.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/sagittarius-contents.png -o assets/sabpuja-zodiac-sagittarius-contents.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/capricorn-hero.png -o assets/sabpuja-zodiac-capricorn-hero.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/capricorn-contents.png -o assets/sabpuja-zodiac-capricorn-contents.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/aquarius-hero.png -o assets/sabpuja-zodiac-aquarius-hero.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/aquarius-contents.png -o assets/sabpuja-zodiac-aquarius-contents.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/pisces-hero.png -o assets/sabpuja-zodiac-pisces-hero.webp
          cwebp -quiet -q 84 -m 6 /tmp/zodiac-batch-03/pisces-contents.png -o assets/sabpuja-zodiac-pisces-contents.webp

          file assets/sabpuja-zodiac-{sagittarius,capricorn,aquarius,pisces}-{hero,contents}.webp
          sha256sum assets/sabpuja-zodiac-{sagittarius,capricorn,aquarius,pisces}-{hero,contents}.webp

      - name: Commit Batch 03 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add assets/sabpuja-zodiac-{sagittarius,capricorn,aquarius,pisces}-{hero,contents}.webp
          if git diff --cached --quiet; then
            echo 'Batch 03 assets already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add Zodiac Batch 03 WebPs'
          git push origin HEAD:staging-2026
