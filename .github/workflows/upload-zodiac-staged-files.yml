name: Upload Zodiac staged files

on:
  push:
    branches:
      - staging-2026
    paths:
      - '.github/workflows/upload-zodiac-staged-files.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload landing files to Shopify staged storage
        shell: bash
        run: |
          set -euo pipefail

          upload_file() {
            local content_type="$1"
            local key="$2"
            local date="$3"
            local credential="$4"
            local signature="$5"
            local policy="$6"
            local filepath="$7"

            curl --fail --show-error --silent \
              -X POST 'https://shopify-staged-uploads.storage.googleapis.com/' \
              -F "Content-Type=${content_type}" \
              -F 'success_action_status=201' \
              -F 'acl=private' \
              -F "key=${key}" \
              -F "x-goog-date=${date}" \
              -F "x-goog-credential=${credential}" \
              -F 'x-goog-algorithm=GOOG4-RSA-SHA256' \
              -F "x-goog-signature=${signature}" \
              -F "policy=${policy}" \
              -F "file=@${filepath};type=${content_type}" \
              > /dev/null
          }

          upload_file \
            'text/plain' \
            'tmp/92313813308/files/00cf0b1b-e847-4694-b6c2-ff6e4933155e/sabpuja-zodiac-remedy-landing.liquid' \
            '20260924T015810Z' \
            'merchant-assets@shopify-tiers.iam.gserviceaccount.com/20260924/auto/storage/goog4_request' \
            '' \
            '' \
            'sections/sabpuja-zodiac-remedy-landing.liquid'

          upload_file \
            'text/css' \
            'tmp/92313813308/files/d70e6181-2833-4a9b-b9a5-fbf1646ecfed/sabpuja-zodiac-remedy-landing.css' \
            '20260924T015810Z' \
            'merchant-assets@shopify-tiers.iam.gserviceaccount.com/20260924/auto/storage/goog4_request' \
            '' \
            '' \
            'assets/sabpuja-zodiac-remedy-landing.css'

          upload_file \
            'text/plain' \
            'tmp/92313813308/files/d3194657-f3f1-4709-bb50-f046331d51d2/collection.liquid' \
            '20260924T015810Z' \
            'merchant-assets@shopify-tiers.iam.gserviceaccount.com/20260924/auto/storage/goog4_request' \
            '' \
            '' \
            'templates/collection.liquid'

          upload_file \
            'image/jpeg' \
            'tmp/92313813308/files/c18d1acd-76fa-434c-956c-bf99a6ae91bd/sabpuja-zodiac-hero-main.webp' \
            '20260924T015810Z' \
            'merchant-assets@shopify-tiers.iam.gserviceaccount.com/20260924/auto/storage/goog4_request' \
            '' \
            '' \
            'assets/sabpuja-zodiac-hero-main.webp'

          echo 'All staged uploads completed.'
