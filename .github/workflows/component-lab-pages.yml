name: Deploy Component Lab to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [staging-2026]
    paths:
      - 'component-lab/**'
      - 'assets/sabpuja-benefits-trust.css'
      - 'assets/sabpuja-kit-contents.css'
      - 'assets/sabpuja-ritual-journey.css'
      - 'assets/sabpuja-faq.css'
      - 'assets/sabpuja-devotional-editorial.css'
      - 'assets/sabpuja-related-products.css'
      - 'assets/sabpuja-final-cta.css'
      - 'assets/sabpuja-logo-horizontal.svg'
      - 'assets/sabpuja-daily-puja-kit-hero.webp'
      - 'assets/sabpuja-zodiac-hero-main.webp'
      - 'assets/sabpuja-zodiac-aries-hero.webp'
      - 'assets/sabpuja-zodiac-aries-contents.webp'
      - 'assets/sabpuja-zodiac-taurus-hero.webp'
      - 'assets/sabpuja-zodiac-gemini-hero.webp'
      - 'assets/sabpuja-zodiac-cancer-hero.webp'
      - 'assets/sabpuja-zodiac-lifestyle.webp'
      - 'assets/sabpuja-navratri-puja-kit-lifestyle.webp'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Component Lab artifact
        run: |
          rm -rf .pages-output
          cp -R component-lab .pages-output
          mkdir -p .pages-output/theme-assets
          cp assets/sabpuja-benefits-trust.css .pages-output/theme-assets/
          cp assets/sabpuja-kit-contents.css .pages-output/theme-assets/
          cp assets/sabpuja-ritual-journey.css .pages-output/theme-assets/
          cp assets/sabpuja-faq.css .pages-output/theme-assets/
          cp assets/sabpuja-devotional-editorial.css .pages-output/theme-assets/
          cp assets/sabpuja-related-products.css .pages-output/theme-assets/
          cp assets/sabpuja-final-cta.css .pages-output/theme-assets/
          cp assets/sabpuja-logo-horizontal.svg .pages-output/theme-assets/
          cp assets/sabpuja-daily-puja-kit-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-hero-main.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-aries-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-aries-contents.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-taurus-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-gemini-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-cancer-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-lifestyle.webp .pages-output/theme-assets/
          cp assets/sabpuja-navratri-puja-kit-lifestyle.webp .pages-output/theme-assets/

          # Authentic Indian temple bell for the Interactive Puja Guide.
          # Original field recording: "Indian Temple Bell.WAV" by ganiket.
          # Recorded in Kothi, Himachal Pradesh, India (2019), released CC0.
          # The same recording is surfaced on Pixabay as "Indian Temple Bell".
          # https://freesound.org/people/ganiket/sounds/466652/
          mkdir -p .pages-output/assets/audio
          python - <<'PY'
          import html as html_lib
          import re
          import subprocess
          from pathlib import Path

          page = "https://freesound.org/people/ganiket/sounds/466652/"
          target = Path(".pages-output/assets/audio/indian-temple-bell.mp3")

          try:
              source = subprocess.check_output(
                  ["curl", "-fsSL", "--retry", "2", "-A", "Mozilla/5.0", page],
                  text=True,
                  timeout=45,
              )
              variants = [
                  source,
                  source.replace(r"\/", "/"),
                  html_lib.unescape(source),
                  html_lib.unescape(source).replace(r"\/", "/"),
              ]
              patterns = [
                  r"https://cdn\.freesound\.org/previews/[^\"'<> ]+?\.mp3",
                  r"//cdn\.freesound\.org/previews/[^\"'<> ]+?\.mp3",
              ]
              url = None
              for variant in variants:
                  for pattern in patterns:
                      match = re.search(pattern, variant)
                      if match:
                          url = match.group(0)
                          if url.startswith("//"):
                              url = "https:" + url
                          break
                  if url:
                      break

              if not url:
                  print("Freesound preview URL was not discoverable; guide will use its built-in fallback bell.")
              else:
                  subprocess.check_call(
                      ["curl", "-fL", "--retry", "2", "-A", "Mozilla/5.0", url, "-o", str(target)],
                      timeout=60,
                  )
                  if target.stat().st_size < 1000:
                      target.unlink(missing_ok=True)
                      print("Downloaded bell asset looked invalid; fallback bell will be used.")
                  else:
                      print(f"Fetched authentic Indian temple bell: {target.stat().st_size} bytes")
          except Exception as exc:
              target.unlink(missing_ok=True)
              print(f"Authentic bell fetch skipped ({exc}); fallback bell remains available.")
          PY
      - name: Upload Component Lab
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-output
          retention-days: 3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
