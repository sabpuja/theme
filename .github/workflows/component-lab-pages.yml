name: Deploy Component Lab to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Component Lab artifact
        run: |
          rm -rf .pages-output
          cp -R component-lab .pages-output
          mkdir -p .pages-output/theme-assets
          cp assets/sabpuja-benefits-trust.css .pages-output/theme-assets/
          cp assets/sabpuja-kit-contents.css .pages-output/theme-assets/
          cp assets/sabpuja-ritual-journey.css .pages-output/theme-assets/
          cp assets/sabpuja-faq.css .pages-output/theme-assets/
          cp assets/sabpuja-devotional-editorial.css .pages-output/theme-assets/
          cp assets/sabpuja-related-products.css .pages-output/theme-assets/
          cp assets/sabpuja-final-cta.css .pages-output/theme-assets/
          cp assets/sabpuja-logo-horizontal.svg .pages-output/theme-assets/
          cp assets/sabpuja-daily-puja-kit-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-hero-main.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-aries-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-aries-contents.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-taurus-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-gemini-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-cancer-hero.webp .pages-output/theme-assets/
          cp assets/sabpuja-zodiac-lifestyle.webp .pages-output/theme-assets/
          cp assets/sabpuja-navratri-puja-kit-lifestyle.webp .pages-output/theme-assets/

      - name: Upload Component Lab
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-output
          retention-days: 3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
