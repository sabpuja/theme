name: Import Navratri landing assets

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/import-navratri-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026

      - name: Download approved Navratri WebP assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-navratri-puja-kit-hero.webp?v=1790077819' -o assets/sabpuja-navratri-puja-kit-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-navratri-puja-kit-contents.webp?v=1790077828' -o assets/sabpuja-navratri-puja-kit-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-navratri-puja-kit-detail.webp?v=1790077837' -o assets/sabpuja-navratri-puja-kit-detail.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-navratri-puja-kit-lifestyle.webp?v=1790077845' -o assets/sabpuja-navratri-puja-kit-lifestyle.webp
          file assets/sabpuja-navratri-puja-kit-*.webp
          sha256sum assets/sabpuja-navratri-puja-kit-*.webp

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add assets/sabpuja-navratri-puja-kit-hero.webp                   assets/sabpuja-navratri-puja-kit-contents.webp                   assets/sabpuja-navratri-puja-kit-detail.webp                   assets/sabpuja-navratri-puja-kit-lifestyle.webp
          if git diff --cached --quiet; then
            echo 'Assets already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add approved Navratri landing page WebPs'
          git push origin HEAD:staging-2026
