name: Import Zodiac Batch 01 WebP assets

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/import-zodiac-batch-01.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026

      - name: Download approved Zodiac Batch 01 assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-aries-hero_492f450b-18d3-4b36-8a78-80309f1fecb2.webp?v=1790087404' -o assets/sabpuja-zodiac-aries-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-aries-contents_b8c5946a-59af-48d7-8d29-5797b9509772.webp?v=1790087419' -o assets/sabpuja-zodiac-aries-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-taurus-hero_b0025be7-ee22-4362-bfdb-217c05684ce5.webp?v=1790087436' -o assets/sabpuja-zodiac-taurus-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-taurus-contents_c3056842-c1d2-43f3-98a7-c7d00826b671.webp?v=1790087448' -o assets/sabpuja-zodiac-taurus-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-gemini-hero_6e861458-ab35-4734-ae90-7da01432b55e.webp?v=1790087464' -o assets/sabpuja-zodiac-gemini-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-gemini-contents.webp?v=1790087480' -o assets/sabpuja-zodiac-gemini-contents.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-cancer-hero.webp?v=1790087495' -o assets/sabpuja-zodiac-cancer-hero.webp
          curl -fL 'https://cdn.shopify.com/s/files/1/0923/1381/3308/files/sabpuja-zodiac-cancer-contents.webp?v=1790087516' -o assets/sabpuja-zodiac-cancer-contents.webp
          file assets/sabpuja-zodiac-{aries,taurus,gemini,cancer}-{hero,contents}.webp
          sha256sum assets/sabpuja-zodiac-{aries,taurus,gemini,cancer}-{hero,contents}.webp

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add assets/sabpuja-zodiac-{aries,taurus,gemini,cancer}-{hero,contents}.webp
          if git diff --cached --quiet; then
            echo 'Assets already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add Zodiac Batch 01 WebPs'
          git push origin HEAD:staging-2026
