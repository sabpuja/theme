name: Refine Zodiac landing 2026

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/refine-zodiac-landing-2026.yml
      - scripts/refine_zodiac_landing_2026.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026
          fetch-depth: 0

      - name: Adapt one-time script to current homepage markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/refine_zodiac_landing_2026.py')
          t=p.read_text(encoding='utf-8')
          start=t.index('# 3) Homepage featured card links to shared landing.')
          end=t.index('# 5) Shared Zodiac landing architecture.')
          replacement='''# 3) Homepage featured card links to shared landing.\nfeatured_path = "sections/sabpuja-home-featured.liquid"\nfeatured = read(featured_path)\nfeatured = featured.replace("{{ routes.all_products_collection_url }}", "/collections/astrology-remedy-kits")\nrequire(featured.count("/collections/astrology-remedy-kits") >= 2, "Featured Zodiac landing link not installed")\nwrite(featured_path, featured)\n\n# 4) Homepage hero Zodiac slide links to shared landing.\nhero_path = "sections/sabpuja-home-hero.liquid"\nhero = read(hero_path)\nhero = hero.replace("{{ routes.all_products_collection_url }}", "/collections/astrology-remedy-kits")\nrequire("/collections/astrology-remedy-kits" in hero, "Hero Zodiac landing link not installed")\nwrite(hero_path, hero)\n\n'''
          p.write_text(t[:start]+replacement+t[end:], encoding='utf-8')
          PY

      - name: Apply routing and visual refinement
        shell: bash
        run: |
          set +e
          python3 scripts/refine_zodiac_landing_2026.py > /tmp/zodiac-refine.log 2>&1
          status=$?
          cat /tmp/zodiac-refine.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/zodiac-refine.log zodiac-refine-debug.txt
            git config user.name 'Sabpuja Automation'
            git config user.email 'automation@sabpuja.com'
            git add zodiac-refine-debug.txt
            git commit -m 'chore: capture Zodiac refinement failure'
            git push origin HEAD:staging-2026
            exit "$status"
          fi

      - name: Commit refined Zodiac experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add templates/product.liquid templates/collection.liquid sections/sabpuja-home-featured.liquid sections/sabpuja-home-hero.liquid sections/sabpuja-zodiac-remedy-landing.liquid assets/sabpuja-zodiac-remedy-landing.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: refine Zodiac landing routing and visual system'
          git push origin HEAD:staging-2026
