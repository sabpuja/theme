name: Refine Zodiac landing 2026

on:
  push:
    branches:
      - staging-2026
    paths:
      - .github/workflows/refine-zodiac-landing-2026.yml
      - scripts/refine_zodiac_landing_2026.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-2026
          fetch-depth: 0

      - name: Apply routing and visual refinement
        shell: bash
        run: |
          set +e
          python3 scripts/refine_zodiac_landing_2026.py > /tmp/zodiac-refine.log 2>&1
          status=$?
          cat /tmp/zodiac-refine.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/zodiac-refine.log zodiac-refine-debug.txt
            git config user.name 'Sabpuja Automation'
            git config user.email 'automation@sabpuja.com'
            git add zodiac-refine-debug.txt
            git commit -m 'chore: capture Zodiac refinement failure'
            git push origin HEAD:staging-2026
            exit "$status"
          fi

      - name: Commit refined Zodiac experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add templates/product.liquid templates/collection.liquid sections/sabpuja-home-featured.liquid sections/sabpuja-home-hero.liquid sections/sabpuja-zodiac-remedy-landing.liquid assets/sabpuja-zodiac-remedy-landing.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: refine Zodiac landing routing and visual system'
          git push origin HEAD:staging-2026
