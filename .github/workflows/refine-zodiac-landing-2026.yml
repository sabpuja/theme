.sp-zodiac__review-left-extras{display:flex;flex-direction:column;gap:13px;margin-top:18px}.sp-zodiac__review-guide,.sp-zodiac__review-support{padding:15px;border:1px solid var(--border);border-radius:12px;background:#FFFBEF}.sp-zodiac__review-guide h3{margin-bottom:10px;font-size:13px}.sp-zodiac__review-guide>span{display:grid;grid-template-columns:18px 1fr;gap:1px 8px;padding:8px 0;border-top:1px solid rgba(78,52,46,.08)}.sp-zodiac__review-guide svg{grid-row:1/3;width:15px;height:15px;color:var(--primary)}.sp-zodiac__review-guide b{font-size:10.5px}.sp-zodiac__review-guide small{color:var(--muted);font-size:9.5px;line-height:1.45}.sp-zodiac__review-support{display:flex;gap:10px;background:#FFF8E7}.sp-zodiac__review-support strong{font-size:11px}.sp-zodiac__review-support p{margin:3px 0 6px;font-size:10px}.sp-zodiac__review-support a{color:var(--primary);font-size:10px;font-weight:800}
.sp-zodiac__review-main{flex:1 1 660px;min-width:0}.sp-zodiac__customers-say h3{font-size:21px}.sp-zodiac__customers-say>p{max-width:760px;margin:8px 0 12px;font-size:13px}.sp-zodiac__learn-more-label{display:block;margin-bottom:8px;font-size:11px}.sp-zodiac__review-topics{display:flex;flex-wrap:wrap;gap:7px}.sp-zodiac__review-topics button,.sp-zodiac__review-topics span{padding:7px 9px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--ink);font-size:10px}.sp-zodiac__review-topics button{cursor:pointer}.sp-zodiac__review-topics button.is-active{border-color:rgba(211,84,0,.35);background:#FFF1E5;color:var(--primary)}
.sp-zodiac__reviews-with-images{margin-top:24px}.sp-zodiac__reviews-images-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.sp-zodiac__reviews-images-head h3{font-size:17px}.sp-zodiac__reviews-images-head span{color:var(--muted);font-size:10px}.sp-zodiac__review-media-strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.sp-zodiac__review-media-strip::-webkit-scrollbar{display:none}.sp-zodiac__review-media-strip button{flex:0 0 clamp(92px,11vw,128px);aspect-ratio:1/1;padding:0;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:#FFF8E7;cursor:pointer}.sp-zodiac__review-media-strip img{width:100%;height:100%;object-fit:cover}
.sp-zodiac__review-feed-wrap{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}.sp-zodiac__review-feed-wrap>h3{font-size:17px}.sp-zodiac__review-feed{margin-top:5px}.sp-zodiac__review-item{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--border)}.sp-zodiac__review-avatar{display:grid;width:36px;height:36px;place-items:center;flex:none;border-radius:50%;background:#F2E9DE;color:var(--ink);font-size:9px;font-weight:800}.sp-zodiac__review-body{min-width:0;flex:1}.sp-zodiac__review-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}.sp-zodiac__review-meta strong{font-size:11px}.sp-zodiac__review-meta time{color:var(--soft);font-size:9.5px}.sp-zodiac__verified{display:inline-flex;align-items:center;gap:3px;margin-left:7px;color:var(--primary);font-size:8.5px}.sp-zodiac__verified svg{width:10px;height:10px}.sp-zodiac__review-item .sp-zodiac__stars{margin-top:5px}.sp-zodiac__review-item .sp-zodiac__stars svg{width:12px;height:12px}.sp-zodiac__review-item h3{margin-top:7px;font-size:13px}.sp-zodiac__review-item p{margin:4px 0 0;color:var(--muted);font-size:11.5px;line-height:1.55}.sp-zodiac__review-inline-media{width:76px;height:76px;margin-top:9px;padding:0;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:#FFF8E7;cursor:pointer}.sp-zodiac__review-inline-media img{width:100%;height:100%;object-fit:cover}.sp-zodiac__load-more{margin-top:15px;min-height:38px;padding:7px 14px;border:1px solid rgba(78,52,46,.23);border-radius:999px;background:#fff;color:var(--ink);font-size:10.5px;font-weight:800;cursor:pointer}.sp-zodiac__reviews-disclosure{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--border);color:var(--soft);font-size:9px}
.sp-zodiac__review-lightbox{position:fixed;z-index:10040;inset:0;display:grid;place-items:center;padding:clamp(14px,3vw,30px);pointer-events:none;opacity:0;transition:opacity .2s ease}.sp-zodiac__review-lightbox.is-open{pointer-events:auto;opacity:1}.sp-zodiac__review-lightbox-backdrop{position:absolute;inset:0;border:0;background:rgba(31,22,18,.72)}.sp-zodiac__review-lightbox-dialog{position:relative;display:flex;flex-wrap:wrap;width:min(860px,96vw);max-height:88vh;overflow:auto;border-radius:16px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.3)}.sp-zodiac__review-lightbox-dialog>img{flex:1 1 520px;min-width:0;max-height:70vh;object-fit:contain;background:#FFF8E7}.sp-zodiac__review-lightbox-dialog>div{flex:1 1 220px;padding:20px}.sp-zodiac__review-lightbox-dialog small,.sp-zodiac__review-lightbox-dialog strong{display:block}.sp-zodiac__review-lightbox-dialog small{color:var(--primary);font-size:9px;text-transform:uppercase;letter-spacing:.12em}.sp-zodiac__review-lightbox-dialog strong{margin-top:5px;font-size:15px}.sp-zodiac__review-lightbox-dialog p{font-size:11px}.sp-zodiac__review-lightbox-close{position:absolute;z-index:2;right:10px;top:10px;display:grid;width:38px;height:38px;place-items:center;border:1px solid rgba(78,52,46,.14);border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink);font-size:21px;cursor:pointer}
.sp-zodiac__final{padding:clamp(28px,3.5vw,44px);background:radial-gradient(circle at 88% 14%,rgba(244,180,0,.18),transparent 30%),#4E342E}.sp-zodiac__btn{min-height:44px;padding:10px 17px;background:var(--primary)}
@container (max-width:760px){.sp-zodiac__review-summary-panel{flex-basis:100%}.sp-zodiac__review-summary-panel>h2{white-space:normal}.sp-zodiac__review-lightbox-dialog>div{flex-basis:100%}}
'''
          write(css_path, css)

          # Assertions: architecture should now be unambiguous.
          product = read(product_path)
          collection = read(collection_path)
          section = read(section_path)
          require("product.type == 'Astrological Remedy Kit'" not in product, 'Astrology product hijack still present')
          require("collection.handle == 'astrology-remedy-kits'" in collection, 'Dedicated collection routing missing')
          require('sp-zodiac__family-track' not in section, '12-card gallery still present')
          require('♋' not in section, 'Ambiguous Cancer glyph still present')
          require('/collections/astrology-remedy-kits' in section, 'Shared landing URL missing')
          require('data-zodiac-product-link' in section, 'Individual PDP link missing')

      - name: Commit refined Zodiac experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sabpuja Automation'
          git config user.email 'automation@sabpuja.com'
          git add templates/product.liquid templates/collection.liquid sections/sabpuja-home-featured.liquid sections/sabpuja-home-hero.liquid sections/sabpuja-zodiac-remedy-landing.liquid assets/sabpuja-zodiac-remedy-landing.css
          git diff --cached --check
          git commit -m 'feat: refine Zodiac landing routing and visual system'
          git push origin HEAD:staging-2026
