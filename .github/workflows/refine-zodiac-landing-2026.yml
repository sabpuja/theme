.sp-zodiac__rating-bars{display:flex;flex-direction:column;gap:9px}.sp-zodiac__rating-bars>div{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:11px}.sp-zodiac__rating-bars span{width:42px}.sp-zodiac__rating-bars i{flex:1;height:12px;overflow:hidden;border:1px solid rgba(78,52,46,.18);border-radius:4px;background:#fff}.sp-zodiac__rating-bars b{display:block;width:var(--rating-width);height:100%;background:linear-gradient(90deg,var(--primary),var(--gold))}.sp-zodiac__rating-bars em{width:33px;text-align:right;color:var(--muted);font-style:normal}
